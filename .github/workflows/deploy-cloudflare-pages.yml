name: Deploy frontend (Cloudflare Pages)

on:
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-cloudflare-pages.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-cloudflare-pages.yml"
  workflow_dispatch:

concurrency:
  group: deploy-pages-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_PAGES_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
    permissions:
      contents: read
      deployments: write
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build
        working-directory: frontend
        run: npm ci && npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/dist --project-name=golf-tech --branch="${CF_PAGES_BRANCH}"
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
